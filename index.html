<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Cookie Clicker TMA</title>
<link rel="stylesheet" href="style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="count-block">
      <div id="cookieCount" class="cookie-count">0</div>
      <div class="cookie-label">печенек</div>
      <div id="cps" class="cps">0 печенек/сек</div>
    </div>
  </header>

  <main class="main">
    <section class="clicker-zone">
      <button id="bigCookie" class="big-cookie" aria-label="Кликнуть печеньку">
        <span class="cookie-emoji">🍪</span>
      </button>
      <div id="floatLayer" class="float-layer"></div>
    </section>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="buildings">Здания</button>
      <button class="tab-btn" data-tab="upgrades">Апгрейды</button>
      <button class="tab-btn" data-tab="stats">Статистика</button>
    </nav>

    <section id="tab-buildings" class="tab-panel active">
      <div id="buildingsList" class="list"></div>
    </section>

    <section id="tab-upgrades" class="tab-panel">
      <div id="upgradesList" class="list"></div>
    </section>

    <section id="tab-stats" class="tab-panel">
      <div id="statsList" class="stats-list"></div>
      <button id="resetBtn" class="reset-btn">Сбросить прогресс</button>
    </section>
  </main>

  <div id="goldenLayer"></div>
  <div id="toast" class="toast"></div>
</div>

<script src="game.js"></script>
</body>
</html>
